<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">

    <title>Tématické kódování 2026</title>
    <link href="style.css" rel="stylesheet">
  </head>
  <body>
<div id="start_menu">
  <h1>Tématické kódování 2026 - jmeno hry</h1>

<button id="btn_play_new">Hrát hru!</button>

</div>

      <p>Směs: <span id="mix"></span> kg/osoba</p>
      <p>Osob: <span id="people"></span></p>
  </div>
</div>


<div id="shop_div">
    <button id="shop_back">Zpět</button>
