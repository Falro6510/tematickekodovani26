<body>

    <!-- STÁLE VIDITELNÁ HLAVIČKA / NÁZEV -->
    <header>
        <h1>Recyklační Město</h1>
    </header>

    <!-- 1. START MENU -->
    <div id="start_menu">
        <h2>Startovní menu</h2>
        <button id="btn_play_new">Nová hra</button>
        <button id="btn_play_cont">Pokračovat ve hře</button>
    </div>

    <!-- 2. HERNÍ OKNO -->
    <div id="game_div" style="display: none;">
        <h2>Herní plocha</h2>
        <p>Den: <span id="day_log">1</span> | Peníze: <span id="money_log">0</span> Kč</p>
        <!-- Tvoje čtvrti a tlačítka -->
        <button id="btn_save">Uložit a odejít do menu</button>
        <button id="shop">Obchod</button>
    </div>

    <!-- 3. OBCHOD -->
    <div id="shop_div" style="display: none;">
        <h2>Obchod</h2>
        <!-- Položky v obchodě -->
        <button id="shop_back">Zpět do hry</button>
    </div>

    <!-- TRVALE VIDITELNÁ GALERIE (zobrazí se na každé obrazovce) -->
    <div class="art-gallery">
        <h3>Galerie ekologického umění a technologií (CC)</h3>
        <div style="display: flex; gap: 15px; flex-wrap: wrap;">
            <div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/c/c1/UFF_clothing_collection_bins_in_Vallila%2C_Helsinki%2C_Finland%2C_2022.jpg" alt="Tříděný odpad" width="200">
                <p><strong>Sběrné nádoby</strong> (CC BY-SA 4.0)</p>
            </div>
            <div>
                <img src="https://upload.wikimedia.org/wikipedia/commons/e/e5/Plastic_waste_sorting_for_recycling.png" alt="Třídění plastů" width="200">
                <p><strong>Třídicí linka</strong> (CC BY 4.0)</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
